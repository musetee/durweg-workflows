name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: musetee/durweg
          path: durweg-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every entry is public, has README and LICENSE, and a valid workflow.json
        run: python tools/check_catalog.py durweg-src
